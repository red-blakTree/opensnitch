name: Compile TS to QM

on:
  push:
    paths:
      - 'ui/i18n/locales/zh_Hans/opensnitch-zh_Hans.ts'
  pull_request:
    paths:
      - 'ui/i18n/locales/zh_Hans/opensnitch-zh_Hans.ts'
  workflow_dispatch:  # 允许手动触发

jobs:
  compile-translations:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Install Qt tools
      run: |
        sudo apt-get update
        sudo apt-get install -y qttools5-dev-tools qttools5-dev
    
    - name: Create output directory
      run: mkdir -p ./compiled_translations
    
    - name: Compile TS to QM
      run: |
        lrelease ui/i18n/locales/zh_Hans/opensnitch-zh_Hans.ts -qm ./compiled_translations/opensnitch-zh_Hans.qm
    
    - name: Upload QM file as artifact
      uses: actions/upload-artifact@v4
      with:
        name: compiled-translation
        path: ./compiled_translations/opensnitch-zh_Hans.qm
        retention-days: 30
    
    - name: Verify compilation
      run: |
        if [ -f "./compiled_translations/opensnitch-zh_Hans.qm" ]; then
          echo "✅ Successfully compiled opensnitch-zh_Hans.qm"
          ls -lh ./compiled_translations/opensnitch-zh_Hans.qm
        else
          echo "❌ Failed to compile .qm file"
          exit 1
        fi
