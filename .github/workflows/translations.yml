name: Build QM Files

on:
  push:
    paths:
      - 'opensnitch/ui/i18n/locales/zh_Hans/opensnitch-zh_Hans.ts'
  pull_request:
    paths:
      - 'opensnitch/ui/i18n/locales/zh_Hans/opensnitch-zh_Hans.ts'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装 Qt 翻译工具（包含 lrelease 命令）
      - name: Install Qt tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qttools5-dev-tools

      # 3. 编译 .ts 文件为 .qm 文件
      - name: Compile QM files
        run: |
          # 创建输出目录
          mkdir -p dist/qm
          # 使用 lrelease 将指定的 ts 文件编译为 qm
          lrelease opensnitch/ui/i18n/locales/zh_Hans/opensnitch-zh_Hans.ts -qm dist/qm/opensnitch-zh_Hans.qm

      # 4. 上传编译好的 .qm 文件作为构建产物（Artifacts）
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opensnitch-zh_Hans-qm
          path: dist/qm/opensnitch-zh_Hans.qm
          if-no-files-found: error
